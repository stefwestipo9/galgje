{% extends 'base.html' %}
{% block head %}
<title>Bagel</title>
<link rel="stylesheet" href= "{{ url_for('getal.static', filename='styles.css') }}">
{% endblock %}

{% block content %}
<p><h2>Bagel</h2>
<div class="row">
    <div class="column">
        <table>
            <tr>
                <td>Bagel</td>
                <td>Onjuist Cijfer</td>
            </tr>
            <tr>
                <td>Pico</td>
                <td>Onjuiste Plek</td>
            </tr>
            <tr>
                <td>Fermi</td>
                <td>Juiste Plek</td>
            </tr>
        </table>
    </div>

    <div class="column">
        <div class="container">
            <div class="text">
                Raad een 3 cijferig getal.
            </div>
            <div class="guess">
                {% for i in range(3) %}
                <select id="{{ i }}">
                {% for i in range(10) %}
                <option value="{{i}}">{{i}}</option>
                {% endfor %}
                </select>
                {% endfor %}
                <button id="submit-btn" type="button">submit</button>
            </div>
            <br><br>
            <div id="status-message">Resterende levens: {{ game_state.levens }}</div> 
            <div class="display"><table></table></div>
            <br><br>
            <button id="restart-btn" type="button"> Restart </button>
        </div>
    </div>
</div>
</p>

<script src="{{ url_for('getal.static', filename='jquery.min.js') }}"></script>
<script>
    $(document).ready(function() {
        $('#submit-btn').on('click', submitGuess);
    
        $('#restart-btn').click(function() {
            $.post('/getal/restart', function(data) {
                updateDisplay(data);
                $('#submit-btn').attr("disabled", false)
            })
        });
        
        function submitGuess() {
            const guess = $('.guess select').map(function() {
                return $(this).val();
            }).get().join('');
            $.post('/getal/guess', {guess: guess}, function(data) {
                updateDisplay(data);
            });
        }

        function updateDisplay(data){
            console.log(data)
            $('.display table').empty();
                for (let i = 0; i < data.geraden.length; i++) {
                    $('.display table').append(`
                        <tr>
                            <td>${data.geraden[i]}</td>
                            <td>${data.uitkomsten[i].join(', ')}</td>
                        </tr>
                    `);
                } 
            
            if (data.status === 'playing') {
                $('#status-message').text("Resterende Pogingen: " + data.levens)
                $('select').val('0');
            }
            if (data.status != 'playing') {
                $('#submit-btn').attr("disabled", true)
                if (data.status == 'won') {
                    $('#status-message').text("Je hebt het geraden!")
                }
                else if (data.status == 'lost') {
                    $('#status-message').text("Je hebt verloren, het getal was " + data.getal)
                };
            }
        }
        // load data when page is refreshed
        const initialData = {{ game_state | tojson }};
        updateDisplay(initialData);
    })
</script>
{% endblock %}
